xt x="590" y="290" font-size="17">Høytrykksspylerens startplass</text><circle cx="565" cy="345" r="9" fill="#5e9571"/><text x="590" y="350" font-size="17">Hele rommet registrerer kjøretøy</text><text x="550" y="435" font-size="19">Lansens vaskerekkevidde: 100 m</text><text x="550" y="475" font-size="16">Spyleren bruker spillets Kärcher-modell,</text><text x="550" y="500" font-size="16">lanse, vannstråle, lyd og vaskefunksjon.</text><text x="550" y="570" font-size="15" fill="#53645a">Skjematisk oversikt ovenfra.</text><text x="550" y="595" font-size="15" fill="#53645a">Plasseringen er målt fra den opplastede modellen.</text></g></svg>